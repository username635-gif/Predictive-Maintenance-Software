# CHANGE THIS: replace with your real domain once you have one pointed at
# the VPS's IP. Until then this can't be tested for real — DNS has to exist
# first. Placeholder used throughout: api.reliabilityos.example
server {
    listen 80;
    server_name api.reliabilityos.example;

    # Certbot will rewrite this block to add TLS (listen 443 ssl, cert
    # paths, etc.) when you run: sudo certbot --nginx -d api.reliabilityos.example
    # Don't hand-write the TLS block yourself — let certbot generate it so
    # the cert paths are guaranteed correct.

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Required for Socket.IO — without these two headers, the WebSocket
        # upgrade handshake fails and Socket.IO silently falls back to
        # long-polling (slower, and may break the io.use() auth middleware
        # behavior depending on transport — worth testing explicitly once
        # this is live, not assuming polling behaves identically).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO connections are long-lived — default proxy timeouts
        # will kill idle connections. 24h here is generous; tune once you
        # see real connection patterns.
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}